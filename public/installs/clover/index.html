<head>

<title>Clover Guest Wi-Fi | Technically Creative</title>

<style>
/* Fonts are self-hosted (same domain, no Google round trips) so the page paints fast on a fresh guest connection. OFL-licensed. */
@font-face { font-family: "Lora"; font-style: normal; font-weight: 400 700; font-display: swap; src: url(/installs/fonts/lora-latin.woff2) format("woff2"); }
@font-face { font-family: "Lora"; font-style: italic; font-weight: 400 700; font-display: swap; src: url(/installs/fonts/lora-italic-latin.woff2) format("woff2"); }
@font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/installs/fonts/hanken-grotesk-latin.woff2) format("woff2"); }
@font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/installs/fonts/geist-mono-latin.woff2) format("woff2"); }
/* Layout: one centred column. A Clover-coloured check (gold glow, leaf disc, cream tick) that turns into the clover on top, TC credit as a quiet mono line at the foot. Single light look by design. */
:root {
  --cream: #ECEFE1;
  --glow: #F6E7BE;
  --ink: #2B3F2E;
  --leaf: #557A4C;
  --gold: #E9BE63;
  --muted: #5E6B5C;
  --tc-black: #000000;
  --tc-white: #FFFFFF;
  --tc-grey: #A8A6A0;
  --serif: "Lora", Georgia, serif;
  --sans: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
.wrap {
  min-height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  padding-block: 40px 28px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  text-align: center;
}
.hero { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 26rem; }
.mark { width: 112px; height: 112px; }
h1 {
  margin: 0; font-family: var(--serif); font-weight: 500;
  font-size: clamp(2.1rem, 9vw, 2.75rem); line-height: 1.08; text-wrap: balance;
}
h1 em { font-style: italic; color: var(--leaf); }
.tc a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.fine { margin: 0; font-size: .82rem; color: var(--muted); }
.tc {
  width: 100%; max-width: 20rem; box-sizing: border-box;
  color: var(--ink);
  padding-top: 18px;
  border-top: 1px solid rgba(43,63,46,.16);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  font-family: var(--mono);
}
.tc .label { font-size: 10px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.tc .word { font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--ink); }
.tc a { color: var(--leaf); font-size: 12px; font-weight: 500; text-decoration: none; border-bottom: 1px solid rgba(85,122,76,.35); padding-bottom: 1px; }
.tc a:hover { border-bottom-color: var(--leaf); }

.nav {
  position: fixed; top: 0; right: 0; z-index: 5;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.home {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; box-sizing: border-box;
  padding: 6px 12px; border-radius: 999px;
  border: 1px solid rgba(43,63,46,.18); background: rgba(236,239,225,.7);
  color: var(--ink); text-decoration: none;
  font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
  animation: rise .6s cubic-bezier(.2,.8,.2,1) 1.2s both;
}
.home:hover { border-color: var(--ink); }
.home:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .home { animation: none; } }
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(120% 70% at 50% 8%, rgba(246,231,190,.6) 0%, rgba(246,231,190,0) 60%);
}
.slot { width: 112px; height: 112px; }
.slot svg { width: 100%; height: 100%; display: block; }
.js .slot svg { visibility: hidden; }
.stage { display: none; }
.js .stage { display: block; }

/* Hand-off from UniFi's success screen.
   UniFi shows a blue check with "Success!" under it, centred on the same cream.
   The page opens on that exact frame, then the check turns green, becomes the clover,
   and the clover glides up into place as the text comes in. Offsets are from the
   viewport centre, like UniFi's centred layout, so the first frame lines up on any screen. */
.stage .mark { position: fixed; left: 50%; top: calc(50% - 38px); width: 112px; height: 112px; margin: -56px 0 0 -56px; z-index: 2; }
.stage .mark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.stage .succ {
  position: fixed; left: 0; right: 0; top: calc(50% + 42px); transform: translateY(-50%);
  margin: 0; text-align: center; color: var(--ink);
  font: 400 27px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.blue { filter: drop-shadow(0 0 5px rgba(76,148,255,.45)); }

@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes shrink { to { opacity: 0; transform: scale(.55); } }
@keyframes pop { 0% { opacity: 0; transform: scale(.6); } 70% { transform: scale(1.04); } 100% { opacity: 1; transform: scale(1); } }
@keyframes stem { from { stroke-dashoffset: 90; } to { stroke-dashoffset: 0; } }
@keyframes leaf { from { transform: rotate(var(--r)) scale(0); } to { transform: rotate(var(--r)) scale(1); } }
@keyframes wash { from { opacity: 0; } to { opacity: 1; } }

/* 0 to 0.35s: identical to UniFi. Then the check turns green and the words leave. */
.stage .blue { animation: fadeout .3s ease .35s forwards; }
.stage .green { opacity: 0; animation: fadein .3s ease .35s forwards; }
.stage .succ { animation: fadeout .3s ease .35s forwards; }
/* 0.75s: the check gives way to the clover in the same spot. */
.stage .checks { transform-origin: 56px 56px; animation: shrink .35s cubic-bezier(.4,0,1,1) .8s forwards; }
.stage .glow { transform-origin: 150px 138px; animation: pop .55s cubic-bezier(.2,.8,.2,1) .8s both; }
.stage .stem { stroke-dasharray: 90; animation: stem .45s ease-out .95s both; }
.stage .lf { transform-origin: 150px 150px; animation: leaf .5s cubic-bezier(.2,.9,.25,1.15) both; }
.stage .l1 { --r: 0deg; animation-delay: 1.05s; }
.stage .l2 { --r: 120deg; animation-delay: 1.15s; }
.stage .l3 { --r: -120deg; animation-delay: 1.25s; }
/* 1.7s: the clover glides up (script) while the page fills in around it. */
.stage .mark.moving { transition: transform .7s cubic-bezier(.65,0,.35,1); }
body::before { opacity: 0; animation: wash .9s ease 1.7s forwards; }
h1, .fine, .tc { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
h1 { animation-delay: 1.85s; }
.fine { animation-delay: 2s; }
.tc { animation-delay: 2.15s; }
.home { animation-delay: 2.2s; }

@media (prefers-reduced-motion: reduce) {
  .stage .checks, .stage .succ { display: none; }
  .stage *, body::before, h1, .fine, .tc, .home { animation: none !important; transition: none !important; opacity: 1; }
}
</style>
</head>

<main class="wrap">

        <g class="lf l2" style="transform: rotate(120deg)"><path transform="translate(100 55)" d="M50 95 C20 70 0 50 0 30 C0 12 14 0 30 0 C40 0 48 6 50 14 C52 6 60 0 70 0 C86 0 100 12 100 30 C100 50 80 70 50 95 Z" fill="#557A4C"/></g>
        <g class="lf l3" style="transform: rotate(-120deg)"><path transform="translate(100 55)" d="M50 95 C20 70 0 50 0 30 C0 12 14 0 30 0 C40 0 48 6 50 14 C52 6 60 0 70 0 C86 0 100 12 100 30 C100 50 80 70 50 95 Z" fill="#86A86E"/></g>

</main>

<div class="stage" aria-hidden="true">
  <div class="mark">
    <svg class="checks" viewBox="0 0 112 112">
      <defs>
        <linearGradient id="uniBlue" x1="16" y1="85" x2="95" y2="28" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#2C66E6"/>
          <stop offset="1" stop-color="#6DB6FF"/>
        </linearGradient>
      </defs>
      <path class="blue" d="M16 63 L38 85 L95 28" fill="none" stroke="url(#uniBlue)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="green" d="M16 63 L38 85 L95 28" fill="none" stroke="#557A4C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg class="clover" viewBox="0 0 300 300" aria-hidden="true">
        <circle class="glow" cx="150" cy="138" r="118" fill="#F6E7BE"/>
        <path class="stem" d="M150 150 C150 182 144 204 151 232" fill="none" stroke="#557A4C" stroke-width="7" stroke-linecap="round"/>
        <g class="lf l1" style="transform: rotate(0deg)"><path transform="translate(100 55)" d="M50 95 C20 70 0 50 0 30 C0 12 14 0 30 0 C40 0 48 6 50 14 C52 6 60 0 70 0 C86 0 100 12 100 30 C100 50 80 70 50 95 Z" fill="#6F9560"/></g>
        <g class="lf l2" style="transform: rotate(120deg)"><path transform="translate(100 55)" d="M50 95 C20 70 0 50 0 30 C0 12 14 0 30 0 C40 0 48 6 50 14 C52 6 60 0 70 0 C86 0 100 12 100 30 C100 50 80 70 50 95 Z" fill="#557A4C"/></g>
        <g class="lf l3" style="transform: rotate(-120deg)"><path transform="translate(100 55)" d="M50 95 C20 70 0 50 0 30 C0 12 14 0 30 0 C40 0 48 6 50 14 C52 6 60 0 70 0 C86 0 100 12 100 30 C100 50 80 70 50 95 Z" fill="#86A86E"/></g>
      </svg>
  </div>
  <p class="succ">Success!</p>
</div>

<script>
(function () {
  var mark = document.querySelector('.stage .mark');
  var slot = document.querySelector('.slot');
  if (!mark || !slot) return;
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var placed = false;
  // Pin the clover to its slot in page coordinates, so it scrolls with the page.
  function pin() {
    var b = slot.getBoundingClientRect();
    mark.classList.remove('moving');
    mark.style.cssText = 'position:absolute;margin:0;transform:none;left:' + (b.left + window.scrollX) + 'px;top:' + (b.top + window.scrollY) + 'px';
    placed = true;
  }
  function glide() {
    var a = mark.getBoundingClientRect(), b = slot.getBoundingClientRect();
    mark.classList.add('moving');
    mark.style.transform = 'translate(' + (b.left - a.left) + 'px,' + (b.top - a.top) + 'px)';
    var done = false;
    function end() { if (!done) { done = true; pin(); } }
    mark.addEventListener('transitionend', end, { once: true });
    setTimeout(end, 900);
  }
  if (still) pin(); else setTimeout(glide, 1700);
  window.addEventListener('resize', function () { if (placed) pin(); });
})();
</script>
